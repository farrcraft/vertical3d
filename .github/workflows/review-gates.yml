name: review gates
# The checks docs/contributing/Review.md lists for the classes a tool can find. The prose and
# boundary gates read only the lines a change adds, so they compare against the branch the pull
# request merges into, or against the previous tip of main after a push to it. The link rule
# checks the whole tree. The fails-first harness needs the compiler, the packages and the
# software Vulkan driver, so it runs in ctest.yml after that workflow's build, not here.
#
# push is filtered to the default branch and pull_request is not, for the reason cpplint.yml
# gives.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
    # the whole history, so each gate can find where the change left the branch it merges into
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # Node runs the gates directly; they use only its own modules and the gates' shared ones in
    # scripts/, and need no install
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    # A push names the previous tip of main. That is all zeros when the branch is new, can be
    # empty, and after a force push can name a commit the checkout does not have. The base is
    # then the pushed commit's first parent, so only that commit is checked. A root commit has no
    # parent, and the step fails rather than compare the commit with itself.
    - name: Set the base to compare against
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "GATE_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
        elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          if ! parent=$(git rev-parse --verify --quiet 'HEAD^'); then
            echo "::error::The push names no previous tip of main that the checkout has, and HEAD is a root commit, so there is no base to compare against."
            exit 1
          fi
          echo "GATE_BASE=$parent" >> "$GITHUB_ENV"
        else
          echo "GATE_BASE=$BEFORE" >> "$GITHUB_ENV"
        fi
    # the gates' own tests, including the C++ lexer they share. Each step after this one runs
    # even when an earlier one failed, so every gate reports
    - name: Gate tests
      run: node --test "scripts/tests/*.test.ts"
    - name: Link rule
      if: ${{ !cancelled() }}
      run: node scripts/linkrule.ts
    # Every action is pinned to a full commit sha, because a tag can be moved to other code after
    # it was reviewed. The version in the comment beside each sha is for a reader, and nothing
    # checks it. A local action, named by a path in this repository, needs no sha.
    - name: Actions are pinned to a commit
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        if grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$)'; then
          echo "::error::Each uses: above names a tag or a branch. Pin it to the full commit sha the tag points at."
          exit 1
        fi
    - name: Prose
      if: ${{ !cancelled() }}
      run: node scripts/prose.ts --base "$GATE_BASE"
    - name: Boundary input
      if: ${{ !cancelled() }}
      run: node scripts/boundary.ts --base "$GATE_BASE"
