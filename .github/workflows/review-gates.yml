name: review gates
# The checks docs/contributing/Review.md lists for the classes a tool can find. The prose and
# boundary gates read only the lines a change adds, so they compare against the branch the pull
# request merges into, or against the previous tip of main after a push to it. The link rule
# checks the whole tree. The fails-first harness builds the tree twice and needs a GPU for the
# device suite, so it runs locally before review and not here.
#
# push is filtered to the default branch and pull_request is not, for the reason cpplint.yml
# gives.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
    # the whole history, so each gate can find where the change left the branch it merges into
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Node runs the gates directly; they use only its own modules and need no install
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    # A push names the previous tip of main. That is all zeros when the branch is new, can be
    # empty, and after a force push can name a commit the checkout does not have. The base is
    # then the pushed commit's first parent, so only that commit is checked. A root commit has no
    # parent, and the step fails rather than compare the commit with itself.
    - name: Set the base to compare against
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "GATE_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
        elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          if ! parent=$(git rev-parse --verify --quiet 'HEAD^'); then
            echo "::error::The push names no previous tip of main and HEAD is a root commit, so there is no base to compare against."
            exit 1
          fi
          echo "GATE_BASE=$parent" >> "$GITHUB_ENV"
        else
          echo "GATE_BASE=$BEFORE" >> "$GITHUB_ENV"
        fi
    - name: Link rule
      run: node scripts/linkrule.ts
    # each gate reports even when an earlier one failed
    - name: Prose
      if: ${{ !cancelled() }}
      run: node scripts/prose.ts --base "$GATE_BASE"
    - name: Boundary input
      if: ${{ !cancelled() }}
      run: node scripts/boundary.ts --base "$GATE_BASE"
