# A pushed tag vX.Y.Z, or vX.Y.Z-rc.N for a release candidate, publishes a GitHub release: the
# Release build's install tree and its installer, and the Flatpak, once every build and test has
# passed. It builds and tests through ctest.yml and flatpak.yml, as a pull request does.
#
# A release restores nothing from the cache and saves nothing to it. Any run on main can write
# the cache, so a release that restored it would ship whatever that run wrote. Each job that
# calls a workflow sets cache-mode to none, which GitHub enforces with the job's cache token:
# every restore misses and every save is refused, whichever action makes it. Every dependency is
# built from source and every tool fetched from its release, so a release takes hours.
name: release

on:
  push:
    tags: ['v*']

# A release is never cancelled by another push, since a cancelled one has published nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # actions: write is what ctest.yml's job asks for, to delete the cache entries a save
  # replaced. A release saves nothing, so it deletes nothing.
  test:
    uses: ./.github/workflows/ctest.yml
    cache-mode: none
    permissions:
      contents: read
      actions: write

  flatpak:
    uses: ./.github/workflows/flatpak.yml
    cache-mode: none

  # The packages are attested, so a user can check they were built here, from the tagged commit.
  # The release's notes are the changelog's section for its version, followed by a link to the
  # code signing policy, and a release candidate is marked as one.
  release:
    needs: [test, flatpak]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    cache-mode: none
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the Windows packages are the artifact release, and the Flatpak is release-flatpak
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a release asset is a file, so a directory here would fail the upload after the release
          # was created
          if [ -n "$(find dist -mindepth 1 -type d)" ]; then
            echo "dist holds a directory, where it should hold only the files to publish:"
            find dist
            exit 1
          fi
          number="${TAG#v}"
          number="${number%%-*}"
          # the lines after the version's heading, up to the next version's
          awk -v heading="## [$number]" 'index($0, heading) == 1 { on = 1; next } /^## \[/ { if (on) exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md's section for $number is empty"
            exit 1
          fi
          # SignPath Foundation requires every release page to link the code signing policy
          printf '\n---\n\n[Code signing policy](%s/%s#code-signing-policy)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          prerelease=()
          case "$TAG" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "Vertical3D ${TAG#v}" --notes-file notes.md "${prerelease[@]}"
