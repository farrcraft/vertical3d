# Builds the tree in Debug and in Release and runs the Boost.Test suites through ctest in each. A
# release ships the Release build, so a defect only Release shows fails here, not in a release.
# A pushed tag vX.Y.Z, or vX.Y.Z-rc.N for a release candidate, also publishes the Release build's
# install tree, its installer and the Flatpak as a GitHub release, once every job has passed.
# This is a separate workflow
# from cpplint rather than a step added to it: cpplint needs nothing but python, and this
# needs a compiler, the Vulkan SDK and a vcpkg install.
name: ctest

# push is filtered to the default branch and pull_request is not: a branch in this repository
# fires both events, so an unfiltered "on: [push, pull_request]" runs every job twice for the
# whole life of a pull request. The cost of that is a second Vulkan SDK install and a second
# boost build per push. A branch with no pull request open gets no run - open one to get CI.
# A change to documents alone does not run it: no build or test reads docs/ or a Markdown file.
# A tag push is never path-filtered, so a release always runs.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# A push that supersedes an earlier one cancels it. The cold dependency build is expensive
# enough that queueing runs of the same branch is worth avoiding.
concurrency:
  group: ctest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120

    # Each build type runs on a runner of its own, beside the other rather than after it. A
    # failure in one does not cancel the other, so a run reports both.
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-release]

    env:
      # The configure preset in CMakePresets.json, and the directory it builds into
      PRESET: ${{ matrix.preset }}
      BUILD_DIR: out/build/${{ matrix.preset }}
      # The out of tree build of the starter example, which consumes the api as source. It is
      # a second build directory rather than a second workflow: it needs this job's toolchain,
      # vcpkg install and SDK, and a runner of its own would build boost again.
      STARTER_BUILD_DIR: out/build/ci-starter
      # The installer names its own directory after the version it carries, so the build is
      # given a fixed root instead and never has to know which version that was.
      VULKAN_SDK_ROOT: C:\VulkanSDK\current
      # vcpkg's binary cache. Named explicitly rather than left on its default under
      # LOCALAPPDATA, because the actions/cache path has to name it too and the runner's own
      # environment is not readable from a workflow expression.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\out\build\vcpkg-cache
      # Mesa's software Vulkan implementation, which gives the render tests a device on a
      # runner that has no gpu. Its version is pinned, where the SDK's above is resolved. Mesa
      # comes from a third-party release, not a package manager. Resolving "latest" would let
      # the driver under the tests change without a commit here.
      MESA_VERSION: "26.2.0"
      # NSIS builds the Windows installer. The runner image does not ship it, and its version is
      # pinned so the installer cannot change without a commit here.
      NSIS_VERSION: "3.13.0"
      MESA_ROOT: ${{ github.workspace }}\out\build\mesa

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, so the fails-first step can find the branch a pull request
          # merges into and read each changed file at its version there
          fetch-depth: 0

      # A release's tag has to name the version the tree builds, and the changelog has to have
      # that version's section, which becomes the release's notes. The step gives the configure
      # the options of a release build. Any other run gives it none.
      - name: The tag names the tree's version
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-(rc\.\d+))?$') { throw "a release tag is vX.Y.Z or vX.Y.Z-rc.N, and $tag is neither" }
          $number = $Matches[1]
          $prerelease = $Matches[2]
          $project = Select-String -Path CMakeLists.txt -Pattern 'project \("vertical3d" VERSION ([0-9.]+)\)'
          if (-not $project) { throw "CMakeLists.txt's project() names no version" }
          $version = $project.Matches[0].Groups[1].Value
          if ($number -ne $version) { throw "the tag $tag names $number, and the tree builds $version" }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($number))\]" -Quiet)) {
            throw "CHANGELOG.md has no section for $number to be the release's notes"
          }
          "options=-DV3D_RELEASE=ON -DV3D_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Defender holds a file while it scans it. Files this job writes are often opened again
      # immediately: the linker's output to embed a manifest, and again by the applocal copy
      # the Configure step describes. Those opens fail while a scan holds the file, so the two
      # directories the job writes into are excluded.
      #
      # This step runs first so that the exclusion covers the downloads and the archives
      # unpacked from them, not only the build.
      #
      # A refused exclusion is a warning rather than a failure.
      - name: Keep Defender out of the build directories
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "excluded $path"
            } catch {
              Write-Warning "Defender refused an exclusion for ${path}: $($_.Exception.Message)"
            }
          }

      # The toolset version is an output because the vcpkg binary cache is keyed on it. vcpkg
      # hashes the compiler into every package's ABI, so a package built by one toolset is
      # never reused by another, and the runner image carries whichever toolset it was built
      # with. Read from the install rather than from vcvars, which no cache key can see.
      - name: Locate the MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "no MSVC toolchain on this image" }
          $line = 'call "' + $install + '\VC\Auxiliary\Build\vcvars64.bat"'
          Set-Content -Path "$env:RUNNER_TEMP\vcvars.bat" -Value $line -Encoding ascii
          $toolset = (Get-Content "$install\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if (-not $toolset) { throw "the toolchain at $install names no default tools version" }
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The version is resolved before the cache is asked for one. A key naming "latest" pins
      # whichever SDK was installed first and never picks up another. Naming the version means
      # a new SDK is a new key.
      - name: Resolve the Vulkan SDK version
        id: sdk
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.json").windows
          if (-not $version) { throw "LunarG named no latest Windows SDK" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore the Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VULKAN_SDK_ROOT }}
          key: vulkan-sdk-${{ runner.os }}-${{ steps.sdk.outputs.version }}

      # This job builds every library, render among them, and render needs the SDK for
      # Vulkan and for glslc - including for the suites that never touch a device.
      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:SDK_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          $arguments = @(
            "--root", "$env:VULKAN_SDK_ROOT",
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the Vulkan SDK installer exited $($process.ExitCode)" }

      - name: Put the Vulkan SDK on the environment
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VULKAN_SDK_ROOT\Bin\glslc.exe")) {
            throw "glslc is not under $env:VULKAN_SDK_ROOT - the SDK install or its cache is incomplete"
          }
          "VULKAN_SDK=$env:VULKAN_SDK_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The SDK is installed under a root of its own rather than to the default location,
          # so the loader has no registry entry telling it where the validation layer is. The
          # render tests assert that the layer was on as well as that it said nothing, because
          # a layer that is not there reports no errors exactly like a clean run does.
          "VK_LAYER_PATH=$env:VULKAN_SDK_ROOT\Bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Lavapipe, so that everything below the recorder has a device to draw with.
      # Without it the render suite skips, and ctest reports the skip. The skip is
      # made in api/render/tests/device/TestMain.cpp.
      - name: Restore lavapipe
        id: mesa-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MESA_ROOT }}
          key: mesa-${{ runner.os }}-${{ env.MESA_VERSION }}

      - name: Install lavapipe
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          New-Item -ItemType Directory -Force -Path "$env:MESA_ROOT" | Out-Null
          # 7z is on the runner image. -y is passed because the archive has nested directories
          & 7z x $archive "-o$env:MESA_ROOT" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacking mesa $env:MESA_VERSION exited $LASTEXITCODE" }

      # VK_DRIVER_FILES is the whole of what the loader will consider, so this runner offers
      # lavapipe and nothing else, and a test that draws cannot quietly pick up something it was
      # not meant to. An elevated process ignores it - the step that registers the ICD covers
      # that case, and registers only this one driver.
      - name: Point the loader at lavapipe
        shell: pwsh
        run: |
          $icd = Get-ChildItem -Path "$env:MESA_ROOT" -Recurse -Filter "lvp_icd.*.json" | Select-Object -First 1
          if (-not $icd) { throw "no lavapipe ICD under $env:MESA_ROOT - the mesa layout has changed" }
          "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # The loader ignores an ICD whose library_path leads nowhere, and then reports the
          # same incompatible driver it reports where there is no driver at all. The dll is
          # checked here, where the directory that should hold it can still be listed.
          $library = (Get-Content $icd.FullName -Raw | ConvertFrom-Json).ICD.library_path
          $driver = if ([System.IO.Path]::IsPathRooted($library)) { $library } else { Join-Path $icd.DirectoryName $library }
          if (-not (Test-Path $driver)) {
            Get-ChildItem $icd.DirectoryName | Format-Table Name, Length | Out-String | Write-Host
            throw "the lavapipe ICD names $library, which is not at $driver - the archive is incomplete or something removed it"
          }

          # An ICD is not a loader. An application links vulkan-1.dll, and the SDK does not
          # carry one. On a developer's machine it arrives in System32 with the gpu driver, and
          # a runner has no gpu driver. The loader is checked here, not left to the tests.
          # Without it a test process does not start at all, and that reads as neither a
          # failure nor a skip.
          $loader = Join-Path $env:WINDIR "System32\vulkan-1.dll"
          if (-not (Test-Path $loader)) {
            throw "there is no vulkan loader at $loader - the SDK installs one only where it can write System32, and nothing else on this image provides it"
          }
          Write-Host "lavapipe ICD: $($icd.FullName)"
          Write-Host "loader:       $loader"

      # This job runs elevated, and the loader ignores VK_DRIVER_FILES and VK_LAYER_PATH in an
      # elevated process. It reads the registry instead, and reports "Found no drivers!" even
      # with both of them set. Each manifest is registered the way the SDK and mesa's
      # own installer register theirs: a DWORD of zero named by the manifest's full path.
      #
      # Only these two are registered, so an elevated run sees the same one driver and one layer
      # that the environment variables name for a run that is not.
      - name: Register the driver and the layer where the loader looks
        shell: pwsh
        run: |
          $layer = Get-ChildItem (Join-Path $env:VULKAN_SDK "Bin") -Filter "VkLayer_khronos_validation.json" | Select-Object -First 1
          if (-not $layer) {
            throw "no validation layer manifest under $env:VULKAN_SDK\Bin - the render suite asserts the layer was on, not only that it was silent"
          }
          $manifests = @{
            "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" = $env:VK_DRIVER_FILES
            "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" = $layer.FullName
          }
          foreach ($key in $manifests.Keys) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name $manifests[$key] -Value 0 -PropertyType DWord -Force | Out-Null
            Write-Host "$key <- $($manifests[$key])"
          }

      # vcpkg builds boost from source, which is most of an hour cold. The binary cache
      # makes a second run cheap. vcpkg refuses a cache directory that is not there.
      #
      # The key names everything vcpkg hashes into a package's ABI that this job can vary.
      # vcpkg.json names the ports and the baseline that fixes their versions, and
      # vcpkg-configuration.json the registries and the overlays. ports/ holds the overlay ports
      # themselves, and the toolset compiles them all. An archive restored under a key missing
      # any of them is not a cheaper build, it is a download whose every entry misses.
      #
      # There is no rung below the toolset in restore-keys for the same reason: a cache built
      # by another compiler cannot be reused by this one, so fetching it only costs time.
      #
      # The key cannot hold everything vcpkg hashes into an ABI. The CMake, PowerShell and
      # vcpkg versions on the image are in it too, and an image update that changes one makes
      # every archive miss. The key therefore ends in the run id and never matches exactly. A
      # restore takes the newest archive under the prefix, and a run whose configure built
      # anything saves a new one.
      - name: Restore the vcpkg binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-
            vcpkg-${{ runner.os }}-${{ steps.msvc.outputs.toolset }}-

      # The archives restored are listed, so that the step after the configure can tell which
      # ones it built.
      - name: Make the vcpkg cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          # an array, so that an empty cache still writes the file
          $restored = @(Get-ChildItem -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" -Recurse -Filter *.zip | ForEach-Object { $_.BaseName })
          Set-Content -Path "$env:RUNNER_TEMP\vcpkg-restored.txt" -Value $restored -Encoding ascii

      # The baseline in vcpkg.json is resolved against the vcpkg checkout that runs the install,
      # and the image's checkout can be older than the baseline. The baseline commit alone is
      # checked out instead and bootstrapped, and every later step uses it through
      # VCPKG_INSTALLATION_ROOT. With no version overrides, that commit holds every port tree
      # the install reads.
      - name: Check vcpkg out at the baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init --quiet $root
          git -C $root fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          if ($LASTEXITCODE -ne 0) { throw "could not fetch the vcpkg baseline $baseline" }
          git -C $root checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not check out the vcpkg baseline $baseline" }
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg did not bootstrap" }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLATION_ROOT=$root"

      # Node runs the notices check, the install's notices and the fails-first harness directly,
      # with no install, at the version the other gates run on in review-gates.yml. It comes before
      # Configure, which records the node on the PATH for the install to run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The ci presets configure with the vcpkg checkout above, and with a job pool that holds
      # linking to one edge at a time. A link edge does more than link: vcpkg's applocal
      # deployment runs in the same edge, reopening the binary just linked and copying dlls out
      # of the installed bin directory the other link edges are reading. Only linking is pooled,
      # so compilation still uses the whole machine.
      - name: Configure
        shell: cmd
        env:
          RELEASE_OPTIONS: ${{ steps.tag.outputs.options }}
        run: |
          call "%RUNNER_TEMP%\vcvars.bat" >nul
          cmake --version || exit /b 1
          ninja --version || exit /b 1
          cmake --preset %PRESET% %RELEASE_OPTIONS% || exit /b 1

      # An archive is named by its package's ABI hash, and the install's status file lists the
      # hash of every package installed. An archive no installed package names is one the
      # configure could not use, and is deleted, so the cache holds one set of packages rather
      # than every set an image update has left behind. Any archive left that was not restored
      # was built by this configure, and the cache is saved.
      - name: Keep only the vcpkg binaries this install used
        id: vcpkg-used
        shell: pwsh
        run: |
          $status = Join-Path $env:BUILD_DIR "vcpkg_installed\vcpkg\status"
          $used = @{}
          foreach ($paragraph in ((Get-Content $status -Raw) -split "\r?\n\r?\n")) {
            if ($paragraph -match "(?m)^Status: install ok installed" -and $paragraph -match "(?m)^Abi: ([0-9a-f]+)") {
              $used[$Matches[1]] = $true
            }
          }
          if ($used.Count -eq 0) { throw "$status names no installed package" }
          $restored = @{}
          foreach ($name in (Get-Content "$env:RUNNER_TEMP\vcpkg-restored.txt")) { $restored[$name] = $true }
          $removed = 0
          $built = 0
          foreach ($archive in (Get-ChildItem -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" -Recurse -Filter *.zip)) {
            if (-not $used.ContainsKey($archive.BaseName)) {
              Remove-Item $archive.FullName
              $removed++
            } elseif (-not $restored.ContainsKey($archive.BaseName)) {
              $built++
            }
          }
          Write-Host "$($used.Count) packages installed, $built built here, $removed stale archives deleted"
          "changed=$($built -gt 0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Saved here, not from a post step. A run whose build or tests fail still keeps the
      # packages the configure just spent the time building. The two build types install the
      # same packages, and each saves under a key of its own, because two saves of one key
      # cannot both succeed.
      - name: Save the vcpkg binaries
        if: steps.vcpkg-used.outputs.changed == 'True'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ github.run_id }}-${{ matrix.preset }}

      # A release shows a licence for everything it ships: every package in the install that
      # ships code has a copyright file, and every font has a licence. The check reads this job's
      # install, which the review gates' runner does not have. Both build types install the same
      # packages, so the Debug build alone runs it.
      - name: Everything a release ships has a licence
        if: matrix.preset == 'ci'
        shell: pwsh
        run: |
          node scripts/notices.ts --installed "$env:BUILD_DIR/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "the notices check exited $LASTEXITCODE" }

      - name: Build
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\vcvars.bat" >nul
          cmake --build "%BUILD_DIR%" || exit /b 1

      # Synchronization validation is off by default and is separate from ordinary
      # validation. It reports hazards caused by a barrier's scopes being wrong, which are the
      # hardest to see by eye and the most likely to come from a rendering change.
      # The render suite is silent under it; the apps are not, and are not run here.
      #
      # The device suites and the render window suite are left out. The steps after this run
      # them, and also fail on a skip, which ctest does not count as a failure.
      - name: Test
        shell: cmd
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          call "%RUNNER_TEMP%\vcvars.bat" >nul
          ctest --test-dir "%BUILD_DIR%" --output-on-failure -E "^(render_(device|window)|ui_device|vertical3d_device)$" || exit /b 1

      # A skipped render suite is a failure here even though it is not one locally. A run where
      # the suite skipped is green but has checked nothing about the renderer. Locally the skip
      # is correct, because a machine may have no device. On this runner lavapipe was just
      # installed, so a skip means the loader is not finding it.
      - name: The render suite ran rather than skipped
        shell: pwsh
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          # Absolute before anything moves, since every path below is built from it.
          $tests = (Resolve-Path "$env:BUILD_DIR\api\render\tests").Path
          # Run from beside the executable. ctest runs it from there, and its committed
          # reference pictures are there. A fixture path resolves against the working
          # directory and against nothing else.
          Push-Location $tests
          & "$tests\v3dtest_render_device.exe" --detect_memory_leaks=0
          $exit = $LASTEXITCODE
          # The suite logs to v3d.log beside the executable rather than to the console, so a
          # run that failed says nothing here on its own. That log and vulkaninfo's view of the
          # loader are printed when it exits non-zero.
          if ($exit -ne 0) {
            $log = Join-Path $tests "v3d.log"
            if (Test-Path $log) {
              Write-Host "--- $log"
              Get-Content $log
            }
            # VK_LOADER_DEBUG makes the loader list the ICDs it found and say what it did with
            # each, which neither the suite nor vulkaninfo reports. The suite is run a second
            # time for it, because the output is long and a run that worked does not need it.
            Write-Host "--- the loader's account"
            $env:VK_LOADER_DEBUG = "error,warn"
            & "$tests\v3dtest_render_device.exe" --detect_memory_leaks=0
            Remove-Item env:VK_LOADER_DEBUG

            # the SDK names it vulkaninfoSDK where it is installed under a root of its own
            $vulkaninfo = Get-ChildItem (Join-Path $env:VULKAN_SDK "Bin") -Filter "vulkaninfo*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vulkaninfo) {
              Write-Host "--- $($vulkaninfo.Name) --summary"
              & $vulkaninfo.FullName --summary
            }
          }
          Pop-Location
          if ($exit -eq 77) {
            throw "the render suite found no device and skipped - VK_DRIVER_FILES is $env:VK_DRIVER_FILES"
          }
          if ($exit -ne 0) { throw "the render suite exited $exit" }

      # The editor's device suite is held to the same rule, on the same device.
      - name: The editor device suite ran rather than skipped
        shell: pwsh
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          $tests = (Resolve-Path "$env:BUILD_DIR\vertical3d\tests").Path
          Push-Location $tests
          & "$tests\v3dtest_vertical3d_device.exe" --detect_memory_leaks=0
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            $log = Join-Path $tests "v3d.log"
            if (Test-Path $log) {
              Write-Host "--- $log"
              Get-Content $log
            }
          }
          Pop-Location
          if ($exit -eq 77) { throw "the editor device suite found no device and skipped" }
          if ($exit -ne 0) { throw "the editor device suite exited $exit" }

      # The ui's device suite is held to the same rule, on the same device.
      - name: The ui device suite ran rather than skipped
        shell: pwsh
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          $tests = (Resolve-Path "$env:BUILD_DIR\api\ui\tests").Path
          Push-Location $tests
          & "$tests\v3dtest_ui_device.exe" --detect_memory_leaks=0
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            $log = Join-Path $tests "v3d.log"
            if (Test-Path $log) {
              Write-Host "--- $log"
              Get-Content $log
            }
          }
          Pop-Location
          if ($exit -eq 77) { throw "the ui device suite found no device and skipped" }
          if ($exit -ne 0) { throw "the ui device suite exited $exit" }

      # The window suite is held to the same rule. This runner opens a window and lavapipe
      # presents to it, so a skip means one of the two stopped working, and the WindowRenderer cases
      # have checked nothing. The suite prints its reason for skipping to the console.
      - name: The render window suite ran rather than skipped
        shell: pwsh
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          $tests = (Resolve-Path "$env:BUILD_DIR\api\render\tests").Path
          Push-Location $tests
          & "$tests\v3dtest_render_window.exe" --detect_memory_leaks=0
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            $log = Join-Path $tests "v3d.log"
            if (Test-Path $log) {
              Write-Host "--- $log"
              Get-Content $log
            }
          }
          Pop-Location
          if ($exit -eq 77) { throw "the render window suite could not open a window to present to, and skipped" }
          if ($exit -ne 0) { throw "the render window suite exited $exit" }

      # A release ships the install tree, so each app has to run from it, from a working directory
      # of its own. An app that cannot find a DLL, a data file or its shaders there fails here.
      # A windowed app returns at once when started from a shell, so each is waited for.
      - name: Every app runs from the install
        if: matrix.preset == 'ci-release'
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\install
        run: |
          cmake --install "$env:BUILD_DIR" --prefix "$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { throw "the install exited $LASTEXITCODE" }
          if (-not (Test-Path "$env:INSTALL_DIR\NOTICES.txt")) { throw "the install wrote no NOTICES.txt" }
          $pictures = "$env:RUNNER_TEMP\from-install"
          New-Item -ItemType Directory -Force -Path $pictures | Out-Null
          Push-Location $pictures
          $failed = @()
          foreach ($app in 'pong', 'tetris', 'voxel', 'odyssey', 'diorama', 'vertical3d') {
            $process = Start-Process -FilePath "$env:INSTALL_DIR\$app.exe" -ArgumentList '--capture', "$pictures\$app.png" -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path "$pictures\$app.png")) { $failed += "$app exited $($process.ExitCode)" }
          }
          & "$env:INSTALL_DIR\moya.exe" --file "$env:INSTALL_DIR\data\moya\raytrace-scene.rib" --output "$pictures\moya.png" --silent
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$pictures\moya.png")) { $failed += "moya exited $LASTEXITCODE" }
          & "$env:INSTALL_DIR\imagetool.exe" --version
          if ($LASTEXITCODE -ne 0) { $failed += "imagetool exited $LASTEXITCODE" }
          Pop-Location
          if ($failed) { throw "from the install: $($failed -join '; ')" }

      - name: Install NSIS
        if: matrix.preset == 'ci-release'
        shell: pwsh
        run: |
          choco install nsis --version $env:NSIS_VERSION --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "installing NSIS $env:NSIS_VERSION exited $LASTEXITCODE" }

      # The installer is built from the same install rules on every run, so a change that breaks
      # it fails here rather than at a release. It installs silently, gives the editor a Start
      # menu entry, and its uninstaller removes every app it installed. The uninstaller is run in
      # place, so it is waited for, and it is left behind as the one file it cannot remove.
      - name: The installer installs and uninstalls
        if: matrix.preset == 'ci-release'
        shell: pwsh
        run: |
          Push-Location $env:BUILD_DIR
          cpack -C Release
          $packed = $LASTEXITCODE
          Pop-Location
          if ($packed -ne 0) { throw "cpack exited $packed" }
          $setup = Get-ChildItem "$env:BUILD_DIR\package\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "cpack wrote no installer" }
          $target = "$env:RUNNER_TEMP\installed"
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installer exited $($process.ExitCode)" }
          foreach ($file in 'vertical3d.exe', 'moya.exe', 'NOTICES.txt', 'data\fonts', 'usd\plugInfo.json') {
            if (-not (Test-Path "$target\$file")) { throw "the installer did not install $file" }
          }
          $menus = @([Environment]::GetFolderPath('CommonPrograms'), [Environment]::GetFolderPath('Programs'))
          if (-not ($menus | Where-Object { Test-Path "$_\Vertical3D\Vertical3D Editor.lnk" })) { throw "the installer made no Start menu entry for the editor" }
          $process = Start-Process -FilePath "$target\Uninstall.exe" -ArgumentList '/S', "_?=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the uninstaller exited $($process.ExitCode)" }
          $left = Get-ChildItem $target -Recurse -File | Where-Object { $_.Name -ne 'Uninstall.exe' }
          if ($left) { throw "the uninstaller left $($left.Count) files, such as $($left[0].FullName)" }

      # A release's tag packages the install tree the step above ran every app from, for the
      # release job to publish beside the installer.
      - name: Package the release
        if: matrix.preset == 'ci-release' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Compress-Archive -Path "$env:RUNNER_TEMP\install\*" -DestinationPath "$env:RUNNER_TEMP\vertical3d-$version-windows-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.preset == 'ci-release' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: |
            ${{ runner.temp }}/vertical3d-*-windows-x64.zip
            ${{ env.BUILD_DIR }}/package/vertical3d-*-windows-x64-setup.exe
          if-no-files-found: error

      # Inside the tree, a target that does not declare its own include path and dependencies
      # still builds, because the root and the apps supply them. Only a separate root project
      # shows the difference, and this step builds one.
      #
      # It also names three libraries in V3D_LIBRARIES rather than taking all of them, so it
      # exercises the dependency closure in cmake/v3dApiLibraries.cmake: a library that links
      # something its manifest entry does not declare stops this configure.
      #
      # It reuses this job's vcpkg install rather than resolving from its own manifest, which
      # would build boost a second time to install the same package set. The Debug build alone
      # runs it, because what it checks does not depend on the build type.
      - name: Build the starter example
        if: matrix.preset == 'ci'
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\vcvars.bat" >nul
          cmake -S examples/starter -B "%STARTER_BUILD_DIR%" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Debug ^
            -DCMAKE_JOB_POOLS="link=1" ^
            -DCMAKE_JOB_POOL_LINK=link ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\out\build\ci\vcpkg_installed" ^
            -DVCPKG_MANIFEST_INSTALL=OFF || exit /b 1
          cmake --build "%STARTER_BUILD_DIR%" || exit /b 1

      # Every test case a pull request adds has to fail without the rest of the pull request: a
      # case that passes on the base does not test the change. The harness builds the affected
      # suites a second time, in a worktree with every file outside tests/ at the base, reusing
      # this job's packages and its link pool. It runs the render suites on lavapipe as the
      # Test step does. Only pull requests run it, because a push to main has already been
      # checked as one. Its worktree and its build go under RUNNER_TEMP, which Defender does not
      # scan. A link that fails there would mark every new case as failing to build, which the
      # harness counts as failing without the change. The Debug build alone runs it: a case
      # fails without the change in both build types or in neither.
      - name: The new test cases fail without the change
        if: github.event_name == 'pull_request' && matrix.preset == 'ci'
        shell: pwsh
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
          # the harness enters the developer environment through this file rather than looking
          # for a Visual Studio edition the image does not have
          V3D_VCVARS: ${{ runner.temp }}\vcvars.bat
        run: |
          node scripts/failsfirst.ts --build "$env:BUILD_DIR" --scratch "$env:RUNNER_TEMP\failsfirst" --base "origin/${{ github.base_ref }}"
          if ($LASTEXITCODE -ne 0) { throw "the fails-first harness exited $LASTEXITCODE" }

  # A release's tag builds the Flatpak as pull requests do, as a release.
  flatpak:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/flatpak.yml

  # A release's tag publishes the packages once every build and test has passed. The packages are
  # attested, so a user can check they were built here, from the tagged commit. The release's notes
  # are the changelog's section for its version, and a release candidate is marked as one.
  release:
    needs: [test, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the Windows packages are the artifact release, and the Flatpak is release-flatpak
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          number="${TAG#v}"
          number="${number%%-*}"
          # the lines after the version's heading, up to the next version's
          awk -v heading="## [$number]" 'index($0, heading) == 1 { on = 1; next } /^## \[/ { if (on) exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md's section for $number is empty"
            exit 1
          fi
          prerelease=()
          case "$TAG" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "Vertical3D ${TAG#v}" --notes-file notes.md "${prerelease[@]}"
