name: cpplint
# push is filtered to the default branch and pull_request is not: a branch in this repository
# fires both events, so an unfiltered "on: [push, pull_request]" runs every job twice for the
# whole life of a pull request. A branch with no pull request open gets no run - open one to
# get CI.
# A change to documents alone does not run it: no build or test reads docs/ or a Markdown file.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
jobs:
  cpplint:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
    # pinned: a newer cpplint can add checks, so a version bump can turn the tree red without
    # a code change
    - run: pip install cpplint==2.0.2
    - run: cpplint --linelength=180 --exclude=out --exclude=vendor --exclude=vcpkg_installed --recursive .
