name: docs
# Builds the documentation site from docs/ and the API reference from the headers, with
# scripts/docs.ts. A pull request builds the site, so a link that names nothing fails it. A
# push to main builds it again and publishes it to GitHub Pages.
#
# push is filtered to the default branch and pull_request is not, for the reason cpplint.yml
# gives.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # the script needs only Node: it fetches mdBook and Doxygen at their pinned versions and
    # checks each against its pinned SHA-256
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Build the site
      run: node scripts/docs.ts
    - name: Hand the site to Pages
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: out/docs
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-26.04
    # deploy-pages proves to Pages, with an OIDC token, that this run may publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # a later push waits for a publish in progress rather than cancelling it
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
