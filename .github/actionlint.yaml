# actionlint's configuration. pre-commit and the workflows job both run actionlint over every
# workflow.
self-hosted-runner:
  # GitHub-hosted labels missing from actionlint's list. Each is hosted, not self-hosted, and
  # comes off this list once a release of actionlint lists it.
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/release.yml:
    ignore:
      # GitHub's cache-mode, which a release sets to none on every job, is missing from
      # actionlint's schema
      - 'unexpected key "cache-mode" for "job" section'
