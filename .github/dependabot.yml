# Version updates for the dependencies Dependabot can read in this repository. vcpkg is not one
# of them: Dependabot updates only a builtin-baseline in vcpkg.json, and this tree keeps its
# baseline in vcpkg-configuration.json, copied into examples/starter. Dependencies.md in
# docs/contributing says how to move it by hand.
version: 2
updates:
  # Every action is pinned to a commit sha with its release in a comment. Dependabot moves both,
  # so an update keeps the pin that review-gates.yml checks for.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # libnoise, the one submodule. voxel links the library built from it.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly

  # The base image of the development container.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
