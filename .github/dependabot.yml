# Version updates for the dependencies Dependabot can read in this repository. Every update
# waits seven days after a release before its pull request opens, so a release that is pulled
# or quickly patched never reaches review.
version: 2
updates:
  # Every action is pinned to a commit sha with its release in a comment. Dependabot moves both,
  # so an update keeps the pin that review-gates.yml checks for.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The vcpkg baseline, the builtin-baseline in vcpkg.json. The starter example carries the
  # same baseline, and the group moves both in one pull request so they never differ.
  - package-ecosystem: vcpkg
    directories:
      - /
      - /examples/starter
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vcpkg:
        patterns: ["*"]
        group-by: dependency-name

  # libnoise, the one submodule. voxel links the library built from it.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # The base image of the development container.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
