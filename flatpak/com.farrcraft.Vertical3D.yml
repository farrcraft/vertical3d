# The Flatpak of every app: the editor, moya, imagetool and the five demos. It runs on the
# Freedesktop runtime and uses the runtime's SDL3, ICU, FreeType, HarfBuzz, libpng, libjpeg,
# SQLite, zlib, zstd, expat and Vulkan loader. Each other dependency is a module below, pinned to
# its source archive at the version vcpkg's baseline builds. thorvg and OpenUSD carry the patches
# of their overlay ports in ports/. docs/contributing/Releasing.md says how it is built and
# published.
id: com.farrcraft.Vertical3D
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: vertical3d
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # the editor keeps its projects in the documents folder, and its file chooser lists what the
  # sandbox can see
  - --filesystem=xdg-documents

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - '*.a'

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=filesystem,json,program_options
      - ./b2 install variant=release link=shared threading=multi -j ${FLATPAK_BUILDER_N_JOBS}
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
      - -DGLM_BUILD_INSTALL=ON
      - -DBUILD_SHARED_LIBS=OFF
    # flatpak-builder finds a licence named LICENSE or COPYING, and glm's is neither
    license-files:
      - copying.txt
    sources:
      - type: archive
        url: https://github.com/g-truc/glm/archive/refs/tags/1.0.3.tar.gz
        sha256: 6775e47231a446fd086d660ecc18bcd076531cfedd912fbd66e576b118607001

  - name: entt
    buildsystem: cmake-ninja
    config-opts:
      - -DENTT_INSTALL=ON
    sources:
      - type: archive
        url: https://github.com/skypjack/entt/archive/refs/tags/v4.0.0.tar.gz
        sha256: 32a2ff2c72cb047dfd57306006ef238820b70da7c6ce4e7e8a507ac63365212e

  - name: fmt
    buildsystem: cmake-ninja
    config-opts:
      - -DFMT_TEST=OFF
      - -DFMT_DOC=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/fmtlib/fmt/archive/refs/tags/12.2.1.tar.gz
        sha256: 449374d74f31b67796dece454d59b93e6f1538efcce0e9ac78000c98142c139e

  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DSPDLOG_FMT_EXTERNAL=ON
      - -DSPDLOG_BUILD_SHARED=ON
      - -DSPDLOG_BUILD_EXAMPLE=OFF
    sources:
      - type: archive
        url: https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
        sha256: d8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744

  - name: cgltf
    buildsystem: simple
    build-commands:
      - install -Dm644 cgltf.h ${FLATPAK_DEST}/include/cgltf.h
      - install -Dm644 cgltf_write.h ${FLATPAK_DEST}/include/cgltf_write.h
    sources:
      - type: archive
        url: https://github.com/jkuhlmann/cgltf/archive/refs/tags/v1.15.tar.gz
        sha256: 84e352092e5cd6aab7f66de62ddb66beb5e6f18d412ca9d12950d7a55bfef25a

  - name: nanosvg
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/memononen/nanosvg/archive/93ce879dc4c04a3ef1758428ec80083c38610b1f.tar.gz
        sha256: 259f5236843a2245fdfd92fddffcaf292ac1f46d24f94f38fa3a9b690501e7d2

  - name: thorvg
    buildsystem: meson
    config-opts:
      - -Dengines=['cpu']
      - -Dloaders=all
      - -Dsavers=all
      - -Dsimd=true
      - -Dbindings=capi
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/thorvg/thorvg/archive/refs/tags/v1.1.3.tar.gz
        sha256: ba9957aeeadb4151d4486f11c638ae118c00210fa4906daa7b30143aa341e690
      - type: patch
        path: ../ports/thorvg/no-global-operator-new.patch

  - name: quickjs-ng
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DQJS_BUILD_EXAMPLES=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.16.2.tar.gz
        sha256: 97c80625b26775a4c7ca618c004d4ea24cf99cbf867e4eba78bd927a8b23d106

  - name: sdl3-mixer
    buildsystem: cmake-ninja
    config-opts:
      - -DSDLMIXER_SAMPLES=OFF
      - -DSDLMIXER_EXAMPLES=OFF
      - -DSDLMIXER_TESTS=OFF
      - -DSDLMIXER_VENDORED=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/archive/refs/tags/release-3.2.4.tar.gz
        sha256: f2ea848ccdf2f394cd4973ee0f6c482e04511044695cccfd46bab6dcd7f780aa

  - name: vulkan-memory-allocator
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/archive/refs/tags/v3.5.0.tar.gz
        sha256: c5f3db848fca9cb9726b41f256cc3007773321fa92a86d1e0902e66474e8a9e3

  - name: onetbb
    buildsystem: cmake-ninja
    config-opts:
      - -DTBB_TEST=OFF
      - -DTBB_STRICT=OFF
    sources:
      - type: archive
        url: https://github.com/uxlfoundation/oneTBB/archive/refs/tags/v2023.2.0.tar.gz
        sha256: 80cb62e62defeee67ea1885a6f72d97ac81404f8fde9cded62fb51524808a30c

  - name: imath
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DIMATH_INSTALL_SYM_LINK=OFF
    license-files:
      - LICENSE.md
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/Imath/archive/refs/tags/v3.2.3.tar.gz
        sha256: e10c12b3f21f45bf08e09d4215d9c7691368d747beebd840de0b6fefed2df9f8

  - name: libdeflate
    buildsystem: cmake-ninja
    config-opts:
      - -DLIBDEFLATE_BUILD_STATIC_LIB=OFF
      - -DLIBDEFLATE_BUILD_GZIP=OFF
    sources:
      - type: archive
        url: https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.26.tar.gz
        sha256: bba03fffc5538576213675ce6968fcff6ce2e67d82e4d5febea2d05f9f13cf85

  - name: openjph
    buildsystem: cmake-ninja
    config-opts:
      - -DOJPH_BUILD_TESTS=OFF
      - -DOJPH_BUILD_EXECUTABLES=OFF
      - -DOJPH_ENABLE_TIFF_SUPPORT=OFF
    sources:
      - type: archive
        url: https://github.com/aous72/OpenJPH/archive/refs/tags/0.32.0.tar.gz
        sha256: 5cb1ebe18e5ee1322d23ff2130b37562d447d1ad5586c3d16cf84be3ae30f719

  - name: openexr
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_WEBSITE=OFF
      - -DCMAKE_REQUIRE_FIND_PACKAGE_libdeflate=ON
      - -DOPENEXR_BUILD_EXAMPLES=OFF
      - -DOPENEXR_BUILD_TOOLS=OFF
      - -DOPENEXR_INSTALL_TOOLS=OFF
    license-files:
      - LICENSE.md
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/openexr/archive/refs/tags/v3.5.3.tar.gz
        sha256: ff1de95f4031c1c57c633e647dc97c15282d3aa3bc7fb90745f00f74de4a054f

  # OpenColorIO's own dependencies. Its configure would download any it does not find, which a
  # Flatpak build cannot, so each is a module and OCIO_INSTALL_EXT_PACKAGES is NONE
  - name: pystring
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/imageworks/pystring/archive/refs/tags/v1.2.0.tar.gz
        sha256: 020a603a757ba1e429f4b1ea6feb3afbe0fb34bcafa355032e1f1b8a0019d198

  - name: yaml-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DYAML_BUILD_SHARED_LIBS=ON
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF
    sources:
      - type: archive
        url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.9.0.tar.gz
        sha256: 25cb043240f828a8c51beb830569634bc7ac603978e0f69d6b63558dadefd49a

  - name: minizip-ng
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DMZ_FETCH_LIBS=OFF
      - -DMZ_LIB_SUFFIX=-ng
      - -DMZ_ZLIB=ON
      - -DMZ_BZIP2=OFF
      - -DMZ_LZMA=OFF
      - -DMZ_ZSTD=OFF
      - -DMZ_OPENSSL=OFF
      - -DMZ_PKCRYPT=OFF
      - -DMZ_WZAES=OFF
      - -DMZ_ICONV=OFF
      - -DCMAKE_DISABLE_FIND_PACKAGE_ZLIBNG=ON
    sources:
      - type: archive
        url: https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.1.0.tar.gz
        sha256: 85417229bb0cd56403e811c316150eea1a3643346d9cec7512ddb7ea291b06f2

  - name: opencolorio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOCIO_BUILD_APPS=OFF
      - -DOCIO_BUILD_DOCS=OFF
      - -DOCIO_BUILD_GPU_TESTS=OFF
      - -DOCIO_BUILD_JAVA=OFF
      - -DOCIO_BUILD_NUKE=OFF
      - -DOCIO_BUILD_OPENFX=OFF
      - -DOCIO_BUILD_PYTHON=OFF
      - -DOCIO_BUILD_TESTS=OFF
      - -DOCIO_INSTALL_EXT_PACKAGES=NONE
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/OpenColorIO/archive/refs/tags/v2.6.0.tar.gz
        sha256: 784ac37bde5b9c6e5dc15f23d1235bd1452d376cdc03627d6d6dd310f375a735

  # OpenSubdiv's CPU library alone, static and position-independent as vcpkg builds it, with
  # every GPU and threading backend off
  - name: opensubdiv
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DNO_CLEW=ON
      - -DNO_CUDA=ON
      - -DNO_DOC=ON
      - -DNO_DX=ON
      - -DNO_EXAMPLES=ON
      - -DNO_GLEW=ON
      - -DNO_GLFW=ON
      - -DNO_GLTESTS=ON
      - -DNO_METAL=ON
      - -DNO_OMP=ON
      - -DNO_OPENCL=ON
      - -DNO_OPENGL=ON
      - -DNO_PTEX=ON
      - -DNO_REGRESSION=ON
      - -DNO_TBB=ON
      - -DNO_TESTS=ON
      - -DNO_TUTORIALS=ON
    license-files:
      - LICENSE.txt
    sources:
      - type: archive
        url: https://github.com/PixarAnimationStudios/OpenSubdiv/archive/refs/tags/v3_5_0.tar.gz
        sha256: 8f5044f453b94162755131f77c08069004f25306fd6dc2192b6d49889efb8095

  # MaterialX's core and format libraries and its standard libraries of node definitions, static
  # and position-independent as vcpkg builds them on Linux, with no shader generator or renderer.
  # moya installs the standard libraries beside itself, so the prefix's copy is removed, with the
  # documents MaterialX installs at the prefix's root
  - name: materialx
    buildsystem: cmake-ninja
    cleanup:
      - /CHANGELOG.md
      - /LICENSE
      - /README.md
      - /THIRD-PARTY.md
      - /libraries
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DMATERIALX_BUILD_GEN_GLSL=OFF
      - -DMATERIALX_BUILD_GEN_MDL=OFF
      - -DMATERIALX_BUILD_GEN_MSL=OFF
      - -DMATERIALX_BUILD_GEN_OSL=OFF
      - -DMATERIALX_BUILD_GEN_SLANG=OFF
      - -DMATERIALX_BUILD_RENDER=OFF
      - -DMATERIALX_BUILD_SHARED_LIBS=OFF
      - -DMATERIALX_BUILD_TESTS=OFF
    license-files:
      - LICENSE
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/MaterialX/archive/refs/tags/v1.39.5.tar.gz
        sha256: c0d739b70a36f6f72888a0e8e66db5c83ae87c40737cc9b51c108166804f3a3b

  - name: openusd
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPXR_BUILD_DOCUMENTATION=OFF
      - -DPXR_BUILD_EXAMPLES=OFF
      - -DPXR_BUILD_TESTS=OFF
      - -DPXR_BUILD_TUTORIALS=OFF
      - -DPXR_BUILD_USD_TOOLS=OFF
      - -DPXR_BUILD_IMAGING=OFF
      - -DPXR_BUILD_USD_IMAGING=OFF
      - -DPXR_ENABLE_GL_SUPPORT=OFF
      - -DPXR_ENABLE_MATERIALX_SUPPORT=OFF
      - -DPXR_ENABLE_OPENVDB_SUPPORT=OFF
      - -DPXR_ENABLE_PTEX_SUPPORT=OFF
      - -DPXR_ENABLE_PYTHON_SUPPORT=OFF
      - -DPXR_PREFER_SAFETY_OVER_SPEED=ON
    sources:
      - type: archive
        url: https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v26.08.tar.gz
        sha256: 4bccbb95cddda1dbeef2f74a08b9456352f2aa91bfd4578c0c613009c7950149
      - type: patch
        path: ../ports/usd/fix-schema-registry-incomplete-type.patch

  - name: vertical3d
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DV3D_BUILD_TESTS=OFF
      # the runtime's libraries are other versions than vcpkg's, and a warning in one of their
      # headers must not stop the build
      - -DV3D_WARNINGS_AS_ERRORS=OFF
    # post-install runs in the build directory, so it starts from the source's root. flatpak-builder
    # installs LICENSE itself
    post-install:
      - |
        cd "${FLATPAK_BUILDER_BUILDDIR}"
        install -Dm644 flatpak/com.farrcraft.Vertical3D.metainfo.xml "${FLATPAK_DEST}/share/metainfo/com.farrcraft.Vertical3D.metainfo.xml"
        install -Dm644 vertical3d/data/icon.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.farrcraft.Vertical3D.svg"
        install -Dm644 flatpak/com.farrcraft.Vertical3D.desktop "${FLATPAK_DEST}/share/applications/com.farrcraft.Vertical3D.desktop"
        for demo in Pong Tetris Voxel Odyssey Diorama; do
          lower=$(echo "$demo" | tr '[:upper:]' '[:lower:]')
          install -Dm644 "demos/$lower/data/icon.svg" "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.farrcraft.Vertical3D.$demo.svg"
          install -Dm644 "flatpak/com.farrcraft.Vertical3D.$demo.desktop" "${FLATPAK_DEST}/share/applications/com.farrcraft.Vertical3D.$demo.desktop"
        done
    sources:
      - type: dir
        path: ..
        skip:
          - out
          - vendor
          - node_modules
          - .flatpak-builder
